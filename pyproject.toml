[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "s2-rag"
version = "0.1.0"
description = "Single-pipeline Reified-Fact spectral graph RAG"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "sentence-transformers>=3,<6",
  "transformers>=4.48,<5",
  "rank-bm25>=0.2.2,<1",
  "networkx>=3.3,<4",
  "PyMuPDF>=1.24,<2",
  "typer>=0.12,<1",
  "ujson>=5.10,<6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
]

[project.scripts]
s2rag = "s2rag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/s2rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
